<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Smart Food Waste Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
</head>
<body>
    <div class="overlay">
        <div class="container">
            <!-- Logo -->
            <div class="logo">♻️</div>

            <!-- Heading -->
            <h1>Smart Food <span>Waste Agent</span></h1>
            <p class="subtitle">AI-Driven Food Freshness & Waste Prevention System</p>
            <div class="line"></div>

            <!-- Food Details Form -->
            <form action="/submit" method="POST">
                <label for="food">🍎 Food Item Name</label>
                <input
                    type="text"
                    id="food"
                    name="food"
                    placeholder="e.g. Tomatoes, Milk, Spinach"
                    required
                    autocomplete="off"
                >

                <label for="quantity">📦 Quantity</label>
                <input
                    type="text"
                    id="quantity"
                    name="quantity"
                    placeholder="e.g. 500g, 2 liters, 4 pieces"
                    required
                >

                <label for="expiry">📅 Estimated Days to Expiry</label>
                <input
                    type="number"
                    id="expiry"
                    name="expiry"
                    placeholder="e.g. 3"
                    min="0"
                    max="365"
                    required
                >

                <label for="storage">🌡️ Current Storage Condition</label>
                <select id="storage" name="storage" required>
                    <option value="Room Temperature">Room Temperature (Pantry/Counter)</option>
                    <option value="Cold Storage">Cold Storage (Refrigerator)</option>
                    <option value="Frozen">Deep Freeze (Freezer)</option>
                </select>

                <label for="category">🥗 Food Category</label>
                <select id="category" name="category" required>
                    <option value="Vegetables">Vegetables</option>
                    <option value="Fruits">Fruits</option>
                    <option value="Dairy">Dairy</option>
                    <option value="Cooked Food">Cooked / Leftover Meal</option>
                    <option value="Bakery">Bakery / Bread</option>
                    <option value="Meat & Seafood">Meat & Seafood</option>
                </select>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn">
                    🔍 Analyze Waste Risk
                </button>
            </form>

            <!-- Food Scanner Link -->
            <div class="scanner-link">
                <p>📸 Want to detect food using your camera?</p>
                <a href="/scanner">
                    Open Food Image Scanner
                </a>
            </div>

            <!-- Features -->
            <div class="bottom-box">
                <div class="feature">
                    🧠
                    <p>AI Insights</p>
                </div>
                <div class="feature">
                    ⭐
                    <p>Smart Actions</p>
                </div>
                <div class="feature">
                    🌱
                    <p>Zero Waste</p>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <p>🌍 Save Food | Reduce Waste | Protect Earth</p>
            </div>
        </div>
    </div>
</body>
</html>
