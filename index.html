
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Food Waste Agent</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}?v=2">
</head>

<body>

    <div class="overlay">

        <div class="container">

            <!-- Logo -->
            <div class="logo">
                ♻️
            </div>

            <!-- Heading -->
            <h1>
                Smart Food <span>Waste Agent</span>
            </h1>

            <p class="subtitle">
                AI-Based Food Waste Management System
            </p>

            <div class="line"></div>

            <!-- Food Details Form -->
            <form action="/submit" method="POST">

                <label for="food">🍎 Food Name</label>
                <input
                    type="text"
                    id="food"
                    name="food"
                    placeholder="Enter food name (e.g. Apple)"
                    required
                >

                <label for="quantity">📦 Quantity</label>
                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    placeholder="Enter quantity"
                    min="1"
                    step="any"
                    required
                >

                <label for="expiry">📅 Expiry Days</label>
                <input
                    type="number"
                    id="expiry"
                    name="expiry"
                    placeholder="Enter expiry days"
                    min="0"
                    required
                >

                <label for="storage">🌡 Storage Condition</label>

                <select id="storage" name="storage" required>
                    <option value="Cold Storage">Cold Storage</option>
                    <option value="Room Temperature">Room Temperature</option>
                    <option value="Frozen">Frozen</option>
                </select>

                <label for="category">🥗 Food Category</label>

                <select id="category" name="category" required>
                    <option value="Vegetables">Vegetables</option>
                    <option value="Fruits">Fruits</option>
                    <option value="Dairy">Dairy</option>
                    <option value="Cooked Food">Cooked Food</option>
                </select>

                <!-- Submit Button -->
                <button type="submit">
                    🔍 Analyze Food
                </button>

            </form>

            <!-- Food Scanner Link -->
            <div class="scanner-link">
                <p>📸 Want to identify food using an image?</p>

                <a href="/scanner">
                    Open Food Image Scanner
                </a>
            </div>

            <!-- Features -->
            <div class="bottom-box">

                <div class="feature">
                    🧠
                    <p>AI Insights</p>
                </div>

                <div class="feature">
                    ⭐
                    <p>Smart Recommendations</p>
                </div>

                <div class="feature">
                    🌱
                    <p>Reduce Waste</p>
                </div>

            </div>

            <!-- Footer -->
            <div class="footer">
                <p>🌍 Save Food | Reduce Waste | Protect Earth</p>
            </div>

        </div>

    </div>

</body>
</html>
